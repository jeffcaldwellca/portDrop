name: PortDrop
options:
  bundleIdPrefix: com.jeffcaldwell
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 88ZPCYS252
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  PortDrop:
    type: application
    platform: macOS
    sources: [PortDrop]
    info:
      path: PortDrop/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: PortDrop
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
    entitlements:
      path: PortDrop/PortDrop.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffcaldwell.PortDrop
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
  PortDropTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PortDropTests]
    dependencies:
      - target: PortDrop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PortDrop:
    build:
      targets: { PortDrop: all, PortDropTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [PortDropTests]
