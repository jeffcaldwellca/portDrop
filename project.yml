name: PortDrop
options:
  bundleIdPrefix: com.jeffcaldwell
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 88ZPCYS252
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  PortDrop:
    type: application
    platform: macOS
    sources: [PortDrop]
    dependencies:
      - package: Sparkle
    info:
      path: PortDrop/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: PortDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.developer-tools
        # Sparkle: the appcast is a release asset, reached through GitHub's stable "latest" redirect.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
    entitlements:
      path: PortDrop/PortDrop.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffcaldwell.PortDrop
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Sparkle: public half of the EdDSA key (generate_keys); releases are signed with the private half.
        SPARKLE_PUBLIC_ED_KEY: "gMEWpjhy+ie6IZpvs0QZW5Uhj70y0lNFWCaZ/AYq53Q="
        SPARKLE_FEED_URL: https://github.com/jeffcaldwellca/portDrop/releases/latest/download/appcast.xml
  PortDropTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PortDropTests]
    dependencies:
      - target: PortDrop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PortDrop:
    build:
      targets: { PortDrop: all, PortDropTests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [PortDropTests]
